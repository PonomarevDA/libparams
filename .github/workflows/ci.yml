name: CI

# pull_request runs every job on pull requests from forks too: no job here needs a secret.
# Both triggers fire on a branch that has an open pull request, which would run every job
# twice, so push is limited to main. Any other branch can be run from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new commit makes the previous pull request run pointless, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code_style:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y astyle cppcheck dos2unix python3-pip
          python3 -m pip install --break-system-packages cpplint pylint

      - name: Run code style checks
        run: make code_style

  build:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi make

      - name: Build all platform examples
        run: |
          make -s stm32f103
          make -s stm32g0b1
          make -s stm32h753xx
          make -s ubuntu
          make -s ubuntu_legacy
          make -s library

  unit_tests:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make googletest libgtest-dev

      - name: Run unit tests
        run: make unit_tests

  test_params_generator:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make googletest libgtest-dev python3-yaml

      - name: Test params generators
        run: |
          make -s c_generator
          make -s cpp_generator
          make -s generator_smoke
